name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Type check
      run: npm run typecheck
    - name: Install Chromium for UI tests
      run: npx playwright install --with-deps chromium
    - name: Run API and UI tests
      run: npm test
      env:
        BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
        BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}
        REQRES_EMAIL: ${{ secrets.REQRES_EMAIL }}
        REQRES_PASSWORD: ${{ secrets.REQRES_PASSWORD }}
        DUMMYJSON_USERNAME: ${{ secrets.DUMMYJSON_USERNAME }}
        DUMMYJSON_PASSWORD: ${{ secrets.DUMMYJSON_PASSWORD }}
        PLATFORM_ADMIN_USERNAME: ${{ secrets.PLATFORM_ADMIN_USERNAME }}
        PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
        REQRES_URL: https://reqres.in/api/
        DUMMYJSON_URL: https://dummyjson.com/
        BOOKER_URL: https://restful-booker.herokuapp.com/
        PLATFORM_URL: https://automationintesting.online/
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
